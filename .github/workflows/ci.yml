name: SOC Lab CI - Syntax & Security Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-syntax-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linting & Validation Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxml2-utils shellcheck
          pip install pyyaml

      - name: 1. Validate YAML Configuration Files
        run: |
          echo "=== Kiem tra cu phap cac file YAML ==="
          python3 -c "
          import os, glob, yaml
          yaml_files = glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True)
          # Loai tru thu muc .github
          target_files = [f for f in yaml_files if not f.startswith('.github')]
          if not target_files:
              print('Khong tim thay file YAML nao can kiem tra.')
          for f in target_files:
              print(f'Checking YAML: {f}')
              with open(f, 'r', encoding='utf-8') as stream:
                  yaml.safe_load(stream)
          print('==> Tat ca cac file YAML hop le!')
          "

      - name: 2. Validate XML Rules Files
        run: |
          echo "=== Kiem tra cu phap cac file XML (Wazuh Rules) ==="
          shopt -s nullglob
          xml_files=(rules/*.xml configs/*.xml)
          if [ ${#xml_files[@]} -eq 0 ]; then
            echo "Chua co file XML trong rules/ hoac configs/."
          else
            for f in "${xml_files[@]}"; do
              echo "Validating XML: $f"
              xmllint --noout "$f"
            done
            echo "==> Tat ca cac file XML hop le!"
          fi

      - name: 3. Validate Python Scripts
        run: |
          echo "=== Kiem tra loi bien dich cu phap Python ==="
          shopt -s nullglob
          py_files=(scripts/*.py)
          if [ ${#py_files[@]} -eq 0 ]; then
            echo "Chua co script Python trong scripts/."
          else
            for f in "${py_files[@]}"; do
              echo "Compiling Python: $f"
              python3 -m py_compile "$f"
            done
            echo "==> Tat ca cac file Python khong co loi cu phap!"
          fi

      - name: 4. Validate Shell Scripts
        run: |
          echo "=== Kiem tra cu phap Shell script (Bash) ==="
          shopt -s nullglob
          sh_files=(scripts/*.sh)
          if [ ${#sh_files[@]} -eq 0 ]; then
            echo "Chua co script Shell trong scripts/."
          else
            for f in "${sh_files[@]}"; do
              echo "Checking Bash syntax: $f"
              bash -n "$f"
            done
            echo "==> Tat ca cac file Bash hop le!"
          fi

      - name: 5. Secret Leak Check (Telegram Bot Token & Private Keys)
        run: |
          echo "=== Quet chong lo token nhay cam len GitHub public ==="
          # Quet dinh dang Telegram bot token (vd: 123456789:ABCdefGHIjklMNO)
          if grep -rEI "[0-9]{8,10}:[a-zA-Z0-9_-]{35}" configs/ scripts/ rules/ 2>/dev/null; then
            echo "::error::Phat hien Telegram Bot Token that trong code! Hay thay the bang bien moi truong hoac chuoi gia dinh 'YOUR_TELEGRAM_BOT_TOKEN'."
            exit 1
          fi

          # Quet private key
          if grep -rEI "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" . --exclude-dir=".git" 2>/dev/null; then
            echo "::error::Phat hien Private Key bi commit vao repo!"
            exit 1
          fi

          echo "==> Khong phat hien lo secret hay token nhay cam!"

