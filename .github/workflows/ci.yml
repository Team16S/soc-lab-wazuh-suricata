name: SOC Lab CI - Syntax & Security Check

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate-syntax-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linting & Validation Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxml2-utils shellcheck
          pip install pyyaml

      - name: 1. Validate YAML Configuration Files (*.yaml, *.yml)
        run: |
          echo "=== Kiem tra cu phap cac file YAML ==="
          python3 -c "
          import os, glob, yaml
          yaml_files = glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True)
          target_files = [f for f in yaml_files if not f.startswith('.github')]
          if not target_files:
              print('Khong tim thay file YAML nao can kiem tra.')
          for f in target_files:
              print(f'Checking YAML: {f}')
              with open(f, 'r', encoding='utf-8') as stream:
                  yaml.safe_load(stream)
          print('==> Tat ca cac file YAML hop le!')
          "

      - name: 2. Validate XML Rules & Config Files (*.xml, *.conf)
        run: |
          echo "=== Kiem tra cu phap cac file XML & Wazuh Config (*.xml, *.conf) ==="
          shopt -s nullglob
          xml_files=(rules/*.xml configs/*.xml configs/*.conf)
          if [ ${#xml_files[@]} -eq 0 ]; then
            echo "Chua co file XML hoac .conf nao can kiem tra."
          else
            for f in "${xml_files[@]}"; do
              echo "Validating XML: $f"
              xmllint --noout "$f"
            done
            echo "==> Tat ca cac file XML & Wazuh Config (.conf) hop le!"
          fi

      - name: 3. Validate Suricata Rules (*.rules)
        run: |
          echo "=== Kiem tra cu phap cac file Suricata Signatures (*.rules) ==="
          shopt -s nullglob
          rules_files=(rules/*.rules)
          if [ ${#rules_files[@]} -eq 0 ]; then
            echo "Chua co file .rules nao can kiem tra."
          else
            for f in "${rules_files[@]}"; do
              echo "Checking Suricata Rule file: $f"
              grep -v '^\s*#' "$f" | grep -v '^\s*$' | while read -r line; do
                if ! echo "$line" | grep -Eq '^(alert|drop|pass|reject)\s+(tcp|udp|icmp|ip|http|dns|tls)\s+'; then
                  echo "::error file=$f::Rule khong dung cu phap Suricata: $line"
                  exit 1
                fi
                if ! echo "$line" | grep -q 'sid:[0-9]\+;'; then
                  echo "::error file=$f::Rule thieu truong sid duy nhat: $line"
                  exit 1
                fi
              done
            done
            echo "==> Tat ca cac file Suricata Rules hop le!"
          fi

      - name: 4. Validate Python Scripts (*.py)
        run: |
          echo "=== Kiem tra loi bien dich cu phap Python ==="
          shopt -s nullglob
          py_files=(scripts/*.py)
          if [ ${#py_files[@]} -eq 0 ]; then
            echo "Chua co script Python trong scripts/."
          else
            for f in "${py_files[@]}"; do
              echo "Compiling Python: $f"
              python3 -m py_compile "$f"
            done
            echo "==> Tat ca cac file Python khong co loi cu phap!"
          fi

      - name: 5. Validate Shell Scripts (*.sh)
        run: |
          echo "=== Kiem tra cu phap Shell script (Bash) ==="
          shopt -s nullglob
          sh_files=(scripts/*.sh)
          if [ ${#sh_files[@]} -eq 0 ]; then
            echo "Chua co script Shell trong scripts/."
          else
            for f in "${sh_files[@]}"; do
              echo "Checking Bash syntax: $f"
              bash -n "$f"
            done
            echo "==> Tat ca cac file Bash hop le!"
          fi

      - name: 6. Secret Leak Check (Chay tren toan bo kho ma nguon & ca tai lieu)
        run: |
          echo "=== Quet chong lo token nhay cam tren toan bo kho luu tru ==="
          if grep -rEI "[0-9]{8,10}:[a-zA-Z0-9_-]{35}" configs/ scripts/ rules/ docs/ *.md 2>/dev/null; then
            echo "::error::Phat hien Telegram Bot Token that trong kho ma nguon hoac tai lieu! Hay thay the bang chuoi gia dinh 'YOUR_TELEGRAM_BOT_TOKEN'."
            exit 1
          fi

          if grep -rEI "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" . --exclude-dir=".git" 2>/dev/null; then
            echo "::error::Phat hien Private Key bi commit vao repo!"
            exit 1
          fi

          echo "==> Khong phat hien lo secret hay token nhay cam!"

      - name: Final Result Status
        run: |
          echo "✅ SUCCESS: Tat ca cac file ky thuat da PASS 100% (YAML, XML/CONF, RULES, PYTHON, BASH, SECRETS)!"
